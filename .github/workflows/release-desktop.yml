name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Identifiant public lu exclusivement depuis les Repository variables.
      # Un Actions secret du même nom est volontairement ignoré.
      JACH_AZURE_CLIENT_ID: ${{ vars.JACH_AZURE_CLIENT_ID || vars.JACH_ID }}
      JACH_SIGNED_UPDATE_FEED_URL: ${{ vars.JACH_SIGNED_UPDATE_FEED_URL }}
      JACH_WINDOWS_PUBLISHER_NAME: ${{ vars.JACH_WINDOWS_PUBLISHER_NAME }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Microsoft authentication configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JACH_AZURE_CLIENT_ID)) {
            throw "Missing Microsoft client ID. In GitHub, open Settings > Secrets and variables > Actions > Variables, then create the Repository variable JACH_AZURE_CLIENT_ID (or legacy alias JACH_ID). An Actions secret is intentionally not read."
          }
          $clientId = $env:JACH_AZURE_CLIENT_ID.Trim()
          if ($clientId -notmatch '\A[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\z') {
            throw "Repository variable JACH_AZURE_CLIENT_ID (or JACH_ID) must be an Azure application ID in GUID format."
          }
          "JACH_AZURE_CLIENT_ID=$clientId" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Host "A non-secret Azure application ID was provided explicitly for this release."

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag and signing configuration
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $version = (Get-Content "packages/launcher/package.json" | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match launcher version $version. Expected $expectedTag."
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD are required: unsigned desktop releases are forbidden."
          }
          if ([string]::IsNullOrWhiteSpace($env:JACH_WINDOWS_PUBLISHER_NAME)) {
            throw "Repository variable JACH_WINDOWS_PUBLISHER_NAME must exactly match the Authenticode certificate simple name."
          }

      - name: Validate isolated signed update channel
        shell: pwsh
        env:
          SIGNED_BLOB_READ_WRITE_TOKEN: ${{ secrets.SIGNED_BLOB_READ_WRITE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNED_BLOB_READ_WRITE_TOKEN)) {
            throw "SIGNED_BLOB_READ_WRITE_TOKEN is required for the signed update store."
          }
          if ([string]::IsNullOrWhiteSpace($env:JACH_SIGNED_UPDATE_FEED_URL)) {
            throw "JACH_SIGNED_UPDATE_FEED_URL is required."
          }
          $signed = [Uri]$env:JACH_SIGNED_UPDATE_FEED_URL
          $legacy = [Uri]"https://5v6eph0amoamojpm.public.blob.vercel-storage.com/releases/windows"
          if ($signed.Scheme -ne "https" -or $signed.Host -eq $legacy.Host) {
            throw "The signed update feed must use HTTPS on a Blob store distinct from the legacy channel."
          }

      - name: Validate one-time legacy bootstrap token
        if: ${{ github.ref_name == format('v{0}', vars.JACH_LEGACY_BOOTSTRAP_VERSION) }}
        shell: pwsh
        env:
          LEGACY_BLOB_READ_WRITE_TOKEN: ${{ secrets.LEGACY_BLOB_READ_WRITE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LEGACY_BLOB_READ_WRITE_TOKEN)) {
            throw "LEGACY_BLOB_READ_WRITE_TOKEN is required only for the configured bootstrap release."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:libs

      - name: Validate desktop types
        run: npm run typecheck --workspace=@jach/launcher

      - name: Test desktop security and update contracts
        run: npx vitest run packages/launcher/src/main

      - name: Build desktop bundles
        run: npm run build --workspace=@jach/launcher

      - name: Package the signed Windows installer
        run: npx electron-builder --win --publish never
        working-directory: packages/launcher
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Verify packaged OAuth and update channel
        shell: pwsh
        run: |
          $mainBundle = Get-Content "packages/launcher/out/main/index.js" -Raw
          if (-not $mainBundle.Contains($env:JACH_AZURE_CLIENT_ID)) {
            throw "The packaged main process does not contain the configured public Azure client ID."
          }
          if (-not $mainBundle.Contains("http://localhost") -or -not $mainBundle.Contains("XboxLive.signin")) {
            throw "The packaged main process is missing the MSAL loopback redirect or XboxLive.signin scope."
          }
          if ($mainBundle.Contains("oauth20_desktop.srf")) {
            throw "The packaged main process still contains the obsolete embedded-browser Microsoft redirect."
          }
          $signedFeed = $env:JACH_SIGNED_UPDATE_FEED_URL.TrimEnd('/')
          if (-not $mainBundle.Contains($signedFeed)) {
            throw "The packaged main process does not contain the isolated signed update feed."
          }
          $version = (Get-Content "packages/launcher/package.json" | ConvertFrom-Json).version
          $installer = "packages/launcher/release/YourLauncher-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path "$installer.blockmap")) { throw "Missing differential blockmap: $installer.blockmap" }
          if (-not (Test-Path "packages/launcher/release/latest.yml")) { throw "Missing latest.yml" }
          $updateConfig = Get-Content "packages/launcher/release/win-unpacked/resources/app-update.yml" -Raw
          $publisherScalar = $updateConfig -match '(?m)^publisherName:[ \t]+\S'
          $publisherList = $updateConfig -match '(?m)^publisherName:[ \t]*\r?$\n[ \t]*-[ \t]+\S'
          if (-not ($publisherScalar -or $publisherList)) {
            throw "app-update.yml does not pin the Authenticode publisher name."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne "Valid") {
            throw "The Windows installer is not Authenticode-signed with a valid certificate (status: $($signature.Status))."
          }
          $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ([string]::IsNullOrWhiteSpace($publisher) -or $publisher -cne $env:JACH_WINDOWS_PUBLISHER_NAME) {
            throw "The actual Authenticode publisher does not exactly match JACH_WINDOWS_PUBLISHER_NAME."
          }
          $publisherPattern = '(?m)^publisherName:\s*[''\"]?' + [regex]::Escape($env:JACH_WINDOWS_PUBLISHER_NAME) + '[''\"]?\s*$'
          if ($updateConfig -notmatch $publisherPattern) {
            throw "app-update.yml does not match the actual Authenticode publisher."
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-Item "packages/launcher/release/YourLauncher-Setup-*.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "packages/launcher/release/SHA256SUMS.txt"

      - name: Publish the public automatic-update channel
        run: node scripts/publish-desktop-update.mjs
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.SIGNED_BLOB_READ_WRITE_TOKEN }}

      - name: Bootstrap legacy clients once
        if: ${{ github.ref_name == format('v{0}', vars.JACH_LEGACY_BOOTSTRAP_VERSION) }}
        run: node scripts/publish-desktop-update.mjs --bootstrap-legacy
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.LEGACY_BLOB_READ_WRITE_TOKEN }}
          JACH_LEGACY_BOOTSTRAP_VERSION: ${{ vars.JACH_LEGACY_BOOTSTRAP_VERSION }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: YourLauncher ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## YourLauncher pour Windows

            Installe l’application, ouvre-la puis saisis simplement le code fourni par ton serveur.

            - Interface Poppins assortie au site YourLauncher
            - Plateforme publique préconfigurée
            - Installation guidée en français
            - Vérification sécurisée des manifestes et téléchargements

            L’installateur est signé avec le certificat Authenticode configuré pour les releases YourLauncher.
          files: |
            packages/launcher/release/YourLauncher-Setup-*.exe
            packages/launcher/release/YourLauncher-Setup-*.exe.blockmap
            packages/launcher/release/latest.yml
            packages/launcher/release/SHA256SUMS.txt
