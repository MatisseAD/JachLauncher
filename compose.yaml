services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yourlauncher
      POSTGRES_USER: yourlauncher
      POSTGRES_PASSWORD: yourlauncher
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourlauncher -d yourlauncher"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - yourlauncher_postgres:/var/lib/postgresql/data

volumes:
  yourlauncher_postgres:
